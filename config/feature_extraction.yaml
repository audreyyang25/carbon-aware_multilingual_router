# config/features.yaml
feature_extraction:
  task_classification:
    task_types: 
      - mmlu
      - gsm8k
      - hellaswag
      - winogrande
      - cnn_dailymail

    embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
    embedding_dim: 384
    instruction_max_length: 50
    classifier_path: "models/task_classifier.pkl"
    
  semantic_clustering:
    num_clusters: 3
    online_update: true
    centroids_path: "models/cluster_centroids.pkl"
    
  complexity:
    measure: "flesch_reading_ease"
    bins:
      - 0
      - 33
      - 67
    use_binned: true
    
  # Language-aware routers (lang_carbon and its ablations)
  language:
    languages: ["en", "de", "es", "fr", "ru", "zh", "th", "sw"]   # one-hot order; an unseen language is all zeros

  multilingual_embedding:
    encoder: "intfloat/multilingual-e5-small"   # 118M params, 384-dim, ~100 languages
    prefix: "query: "                           # e5 models expect this prefix on inputs
    embeddings_path: "data/features/embeddings_multilingual-e5-small.npz"
    pca_dim: 16                                 # fit on training items only, at simulation time

  # GreenServ's English encoder, cached the same way: semantic clusters are fit on it, and the
  # carbon_en_emb control router uses it so encoders can be compared with everything else equal
  english_embedding:
    encoder: "sentence-transformers/all-MiniLM-L6-v2"
    prefix: ""
    embeddings_path: "data/features/embeddings_all-MiniLM-L6-v2.npz"
    pca_dim: 16

  context_vector:
    one_hot_encode: true
    include_raw_embeddings: false
    normalize_numeric: true

feasibility:
  max_latency: 5