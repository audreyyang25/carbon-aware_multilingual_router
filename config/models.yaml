# config/models.yaml
# Model pool (arms). parameter_count is in billions and orders the always-small / always-large baselines.
# auto_class: "causal_lm" (default) or "multimodal" for checkpoints saved as *ForConditionalGeneration
#             (text-only prompts are fine; the vision tower just isn't used).
# chat_template_kwargs: extra apply_chat_template options (enable_thinking=False is always set).

qwen3.5-2b:
  name: "Qwen/Qwen3.5-2B"
  parameter_count: 2.3
  family: "qwen3.5"
  auto_class: "multimodal"

tiny-aya-global:
  name: "CohereLabs/tiny-aya-global"     # gated: accept the license on HF first
  parameter_count: 3.35
  family: "aya"
  auto_class: "causal_lm"

gemma-4-e4b:
  name: "google/gemma-4-E4B-it"
  parameter_count: 4                     # effective params; 8B stored incl. per-layer embeddings
  family: "gemma4"
  auto_class: "multimodal"

qwen3.5-9b:
  name: "Qwen/Qwen3.5-9B"
  parameter_count: 9.7
  family: "qwen3.5"
  auto_class: "multimodal"

qwen3.5-27b:
  name: "Qwen/Qwen3.5-27B"
  parameter_count: 27.8
  family: "qwen3.5"
  auto_class: "multimodal"

gemma-4-31b:
  name: "google/gemma-4-31B-it"
  parameter_count: 31.3
  family: "gemma4"
  auto_class: "multimodal"
